plugins {
    id 'com.android.application'
}

android {
    namespace 'io.lite.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'io.lite.tvlauncher'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Release-сборка: оптимизирована R8 и не "debuggable" — заметно быстрее debug.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Подписываем отладочным ключом, чтобы APK сразу ставился на ТВ.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Никаких зависимостей: только Android SDK. APK получается ~40 КБ.
